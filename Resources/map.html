<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
    <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id='map'></div>
    <script>
        var map = L.map('map').setView([51.1657, 10.4515], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        var currentMarker = null;
        var imageMarkers = [];
        var selectedMarker = null;
        var gridLayer = null;

        var selectedIconHtml = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42"><path fill="#2196F3" stroke="#FFF" stroke-width="2" d="M16 0C9.4 0 4 5.4 4 12c0 8 12 30 12 30s12-22 12-30c0-6.6-5.4-12-12-12z"/><circle cx="16" cy="12" r="6" fill="#FFF"/></svg>';
        var normalIconHtml = '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="35" viewBox="0 0 25 35"><path fill="#4CAF50" stroke="#FFF" stroke-width="2" d="M12.5 0C7.25 0 3 4.25 3 9.5c0 6.25 9.5 23.5 9.5 23.5S22 15.75 22 9.5C22 4.25 17.75 0 12.5 0z"/><circle cx="12.5" cy="9.5" r="4" fill="#FFF"/></svg>';
        var clickIconHtml = '<svg xmlns="http://www.w3.org/2000/svg" width="25" height="35" viewBox="0 0 25 35"><path fill="#FF5722" stroke="#FFF" stroke-width="2" d="M12.5 0C7.25 0 3 4.25 3 9.5c0 6.25 9.5 23.5 9.5 23.5S22 15.75 22 9.5C22 4.25 17.75 0 12.5 0z"/><circle cx="12.5" cy="9.5" r="4" fill="#FFF"/></svg>';

        var selectedIcon = L.icon({
            iconUrl: 'data:image/svg+xml;base64,' + btoa(selectedIconHtml),
            iconSize: [32, 42],
            iconAnchor: [16, 42],
            popupAnchor: [0, -42]
        });

        var normalIcon = L.icon({
            iconUrl: 'data:image/svg+xml;base64,' + btoa(normalIconHtml),
            iconSize: [25, 35],
            iconAnchor: [12.5, 35],
            popupAnchor: [0, -35]
        });

        var clickIcon = L.icon({
            iconUrl: 'data:image/svg+xml;base64,' + btoa(clickIconHtml),
            iconSize: [25, 35],
            iconAnchor: [12.5, 35],
            popupAnchor: [0, -35]
        });

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            
            currentMarker = L.marker([lat, lng], { icon: clickIcon }).addTo(map);
            currentMarker.bindPopup('<b>Neue Koordinaten:</b><br>Lat: ' + lat.toFixed(6) + '<br>Lng: ' + lng.toFixed(6)).openPopup();
            
            window.chrome.webview.postMessage(lat + ',' + lng);
        });

        function addImageMarkers(markers) {
            imageMarkers.forEach(m => map.removeLayer(m));
            imageMarkers = [];
            
            markers.forEach(function(m) {
                var marker = L.marker([m.lat, m.lng], { icon: normalIcon }).addTo(map);
                marker.bindPopup('<b>' + m.name + '</b><br>Lat: ' + m.lat.toFixed(6) + '<br>Lng: ' + m.lng.toFixed(6));
                marker.imageId = m.id;
                imageMarkers.push(marker);
            });

            if (markers.length > 0) {
                var group = new L.featureGroup(imageMarkers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        function setSelectedMarker(lat, lng, name) {
            if (selectedMarker) {
                map.removeLayer(selectedMarker);
            }
            
            selectedMarker = L.marker([lat, lng], { icon: selectedIcon }).addTo(map);
            selectedMarker.bindPopup('<b>Ausgewählt:</b><br>' + name + '<br>Lat: ' + lat.toFixed(6) + '<br>Lng: ' + lng.toFixed(6)).openPopup();
            map.setView([lat, lng], Math.max(map.getZoom(), 13));
        }

        function clearSelectedMarker() {
            if (selectedMarker) {
                map.removeLayer(selectedMarker);
                selectedMarker = null;
            }
        }

        function updateGrid(enabled, size) {
            if (gridLayer) {
                map.removeLayer(gridLayer);
                gridLayer = null;
            }

            if (!enabled) return;

            gridLayer = L.layerGroup();
            var bounds = map.getBounds();
            var metersPerDegree = 111000;
            var gridSize = size / metersPerDegree;

            var south = Math.floor(bounds.getSouth() / gridSize) * gridSize;
            var north = Math.ceil(bounds.getNorth() / gridSize) * gridSize;
            var west = Math.floor(bounds.getWest() / gridSize) * gridSize;
            var east = Math.ceil(bounds.getEast() / gridSize) * gridSize;

            for (var lat = south; lat <= north; lat += gridSize) {
                for (var lng = west; lng <= east; lng += gridSize) {
                    var rectBounds = [
                        [lat, lng],
                        [lat + gridSize, lng + gridSize]
                    ];
                    L.rectangle(rectBounds, {
                        color: '#2196F3',
                        weight: 1,
                        fillOpacity: 0.05,
                        fillColor: '#2196F3'
                    }).addTo(gridLayer);
                }
            }

            gridLayer.addTo(map);
        }

        map.on('moveend', function() {
            if (gridLayer) {
                updateGrid(true, currentGridSize);
            }
        });

        var currentGridSize = 100;
    </script>
</body>
</html>
